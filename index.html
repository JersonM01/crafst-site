<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bricolage+Grotesque:wght@500;800&display=swap">
<style>
/* Concept : plateforme régionale lumineuse. Fond blanc, bleu dominant, jaune maïs en accent, vert dosé.
   Bandes alternées séparées par des vagues, hero à champs en terrasses, schéma de corridor transfrontalier. */
:root{
  --navy:#0B4F6C; --navy-deep:#073547; --green:#2E8B3E; --green-deep:#1F6B33;
  --sun:#F2B705; --sun-soft:#FDF1C4; --sky:#D3E8EE; --sky-soft:#E8F3F6; --mint:#E6F2E3;
  --ink:#14212E; --muted:#4A5B6C; --line:#D0E2E8; --bg:#FFFFFF;
  --f-display:"Inter","Segoe UI",system-ui,sans-serif;
  --f-ui:"Inter","Segoe UI",system-ui,sans-serif;
  --red:#B42318; --red-deep:#8E1B13; --cream:#FDF1C4;
  --r:18px; --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy-deep)}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.025em}
p{margin:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--green-deep)}
.on-dark .eyebrow{color:var(--sun)}
.lead{font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:62ch}
.on-dark .lead{color:#BFDCE5}

/* barre utilitaire */
.util{background:var(--navy-deep);color:#D3E8EE;font-size:13px}
.util .wrap{display:flex;gap:6px 18px;align-items:center;justify-content:space-between;padding-block:8px;flex-wrap:wrap}
.util nav{display:flex;gap:4px 16px;flex-wrap:wrap;align-items:center}
.util a,.util button.ul{color:#D3E8EE;text-decoration:none;background:none;border:0;padding:2px 0;font-size:13px;font-weight:500}
.util a:hover,.util button.ul:hover{color:var(--sun)}
.lang{display:inline-flex;border:1px solid #3C7A92;border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:#D3E8EE;padding:2px 11px;font-size:12px;font-weight:700}
.lang button[aria-pressed=true]{background:var(--sun);color:var(--navy-deep)}

/* en-tête : diaporama */
body.nohome header.top{display:none}
.top{position:relative;height:clamp(400px,50vw,580px);background:var(--navy-deep);overflow:hidden;isolation:isolate}
.sl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease;transform:scale(1.02)}
.sl.on{opacity:1;animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.09)}}
.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,53,71,.18) 0%,rgba(7,53,71,0) 35%,rgba(7,53,71,.62) 100%);z-index:1}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:2;background:rgba(7,53,71,.22);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);border-top:1px solid rgba(255,255,255,.28);color:#fff}
.cap .wrap{display:flex;align-items:center;gap:clamp(14px,2.4vw,30px);padding-block:clamp(14px,2.2vw,26px)}

.crafst-logo{--emblem:none;max-width:680px;box-sizing:border-box}
.crafst-logo *{box-sizing:border-box}
.crafst-logo .cl-card{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;justify-content:center;gap:clamp(4px,1.5vw,14px);padding:clamp(8px,1.6vw,14px) clamp(14px,3vw,26px) clamp(8px,1.6vw,14px) clamp(8px,1.6vw,14px);position:relative;padding-left:calc(clamp(92px,15vw,168px)*.07)}
.crafst-logo .cl-emw{--s:clamp(92px,15vw,168px);position:relative;z-index:2;width:var(--s);aspect-ratio:1;flex:0 0 auto;margin-right:calc(var(--s) * -0.1)}
.crafst-logo .cl-emw svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.crafst-logo .cl-em{position:absolute;left:22%;top:22%;width:56%;height:56%;border-radius:50%;background:var(--emblem) center/cover no-repeat}
.crafst-logo .cl-tx{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0;position:relative;z-index:1}
.crafst-logo .cl-big{margin:0 0 clamp(5px,1.2vw,10px) -0.035em;font-size:clamp(28px,6.4vw,58px);line-height:1;white-space:nowrap;font-family:'Bricolage Grotesque','Inter',sans-serif;font-weight:800;letter-spacing:-1px;color:#A6E08B}
.crafst-logo .cl-sub{margin:0;font-size:clamp(10px,1.7vw,15px);line-height:1.35;letter-spacing:.2px;font-family:'Bricolage Grotesque','Inter',sans-serif;font-weight:500;color:#D9ECF2}
.cap .wrap.lg{padding-block:clamp(12px,1.8vw,20px)}
.cap:has(.crafst-logo){background:rgba(4,38,52,.46)}
.crafst-logo .cl-big,.crafst-logo .cl-sub{text-shadow:0 2px 14px rgba(0,0,0,.55)}
.crafst-logo .cl-emw svg{filter:drop-shadow(0 2px 8px rgba(0,0,0,.45))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
footer .crafst-logo{max-width:420px}
footer .crafst-logo .cl-emw{--s:clamp(84px,9vw,118px)}
footer .crafst-logo .cl-big{font-size:clamp(26px,3.2vw,38px)}
footer .crafst-logo .cl-sub{font-size:clamp(10px,1.2vw,12.5px)}
.cap img{width:clamp(62px,8vw,104px);height:auto;flex:none;border-radius:16px;background:#fff;padding:5px;box-shadow:0 8px 24px -8px rgba(0,0,0,.5)}
.cap h1{font-size:clamp(50px,9.5vw,118px);font-weight:900;letter-spacing:-.045em;line-height:.88;color:#fff;text-shadow:0 3px 24px rgba(0,0,0,.4)}
.cap .sw{font-weight:800;color:var(--sun);font-size:clamp(14px,1.5vw,19px);letter-spacing:.04em;margin-top:8px;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.cap .defn{margin-top:10px;font-size:clamp(10.5px,1.2vw,14px);font-weight:700;letter-spacing:.12em;text-transform:uppercase;line-height:1.45;max-width:64ch;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.dots{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:16px;z-index:3;display:flex;gap:8px}
.dots button{width:30px;height:5px;border-radius:5px;border:0;padding:0;background:rgba(255,255,255,.5);transition:.3s}
.dots button[aria-current=true]{background:var(--sun);width:46px}
.mainnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--navy);box-shadow:0 6px 18px -10px rgba(7,53,71,.6)}
.mainnav .wrap{display:flex;align-items:stretch}
.mainnav ul{display:flex;list-style:none;margin:0;padding:0;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.mainnav ul::-webkit-scrollbar{display:none}
.mainnav li{flex:none}
.mainnav a.nv{display:block;color:#fff;text-decoration:none;font-weight:600;font-size:14.5px;padding:15px 11px;position:relative;white-space:nowrap}
.mainnav a.nv::after{content:"";position:absolute;left:11px;right:11px;bottom:8px;height:3px;border-radius:3px;background:var(--sun);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.mainnav a.nv:hover::after,.mainnav a.nv[aria-current=page]::after{transform:scaleX(1)}
.mainnav a.nv .n{color:var(--sun);font-weight:800;margin-right:5px;font-size:12px}
.mainnav .dn{align-self:center;margin-left:8px;flex:none}

.toc2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.toc2 .k{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
.toc2 p{margin:0;font-weight:700;font-size:clamp(19px,2.2vw,26px);line-height:1.35}
.toc2 .gl{background:var(--navy);color:#fff;padding:clamp(24px,3vw,36px);border-radius:6px}.toc2 .gl .k{color:var(--sun)}
.toc2 .im{background:#fff;border:2px solid var(--green);color:var(--navy);padding:clamp(24px,3vw,36px);border-radius:6px}.toc2 .im .k{color:var(--green-deep)}
.tocta{background:var(--navy);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:16px}.tocta h3{color:#fff}
@media (max-width:760px){.toc2{grid-template-columns:1fr}}
.mainnav li.hs{position:relative}
.mainnav .cv{display:inline-block;width:6px;height:6px;border-right:2px solid var(--sun);border-bottom:2px solid var(--sun);transform:rotate(45deg) translate(-2px,-2px);margin-left:7px}
.mainnav .sub{display:none;position:absolute;left:0;top:100%;min-width:300px;max-width:380px;background:var(--navy-deep);padding:8px;border-radius:0 0 14px 14px;box-shadow:0 18px 36px -14px rgba(7,53,71,.7);z-index:60}
.mainnav .sub a{display:block;color:#fff;text-decoration:none;font-weight:600;font-size:14.5px;line-height:1.3;padding:10px 14px;border-radius:9px}
.mainnav .sub a:hover,.mainnav .sub a:focus-visible{background:rgba(255,255,255,.12);color:var(--sun)}
.mainnav li.hs:hover .sub,.mainnav li.hs:focus-within .sub{display:block}
.mainnav.shut .sub{display:none!important}
@media (min-width:1001px){.mainnav ul{overflow:visible}}
@media (max-width:1000px){.mainnav .sub,.mainnav .cv{display:none!important}}

.prog{position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,var(--sun),var(--green),var(--sun));transform:scaleX(0);transform-origin:left;opacity:0}
.prog.run{animation:sweep .8s var(--ease)}
@keyframes sweep{0%{transform:scaleX(0);opacity:1}70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}

/* boutons */
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:99px;padding:13px 24px;font-weight:700;font-size:15px;text-decoration:none;border:2px solid transparent;transition:transform .25s var(--ease),box-shadow .25s,background .25s,color .25s;position:relative;overflow:hidden;line-height:1.2}
.btn .ar{display:inline-block;transition:transform .3s var(--ease)}
.btn:hover .ar{transform:translateX(5px)}
.btn:active{transform:scale(.97)}
.btn-sun{background:var(--sun);color:var(--navy-deep)}
.btn-sun:hover{box-shadow:0 10px 24px -8px rgba(242,183,5,.8);transform:translateY(-2px)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-deep);box-shadow:0 10px 24px -10px rgba(11,79,108,.8);transform:translateY(-2px)}
.btn-line{border-color:var(--navy);color:var(--navy);background:transparent}
.btn-line:hover{background:var(--navy);color:#fff;transform:translateY(-2px)}
.on-dark .btn-line{border-color:#fff;color:#fff}.on-dark .btn-line:hover{background:#fff;color:var(--navy)}
.btn-sm{padding:8px 16px;font-size:13.5px}
.btn[disabled],.btn.off{opacity:.55;cursor:not-allowed}
.btn .heart{display:inline-block;animation:beat 2.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.25)}24%{transform:scale(1)}}

/* vues */
main{display:block;min-height:60vh}
main.enter>*{animation:rise .6s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}.rv.d4{transition-delay:.32s}

.band{padding-block:clamp(56px,8vw,104px);position:relative}
.band-sky{background:var(--sky-soft)}
.band-navy{background:var(--navy);color:#fff}
.band-deep{background:var(--navy-deep);color:#fff}
.band-mint{background:var(--mint)}
.on-dark h2,.on-dark h3{color:#fff}
.band h2{font-size:clamp(30px,4.4vw,52px);color:var(--navy);margin-top:10px}
.band .sh{display:grid;gap:14px;margin-bottom:clamp(30px,4vw,52px)}
.wave{display:block;width:100%;height:clamp(34px,5vw,70px);margin-bottom:-1px}

/* hero */
.hero{background:linear-gradient(180deg,#fff 0%,var(--sky-soft) 100%);padding-block:clamp(36px,6vw,80px) clamp(20px,4vw,50px);position:relative;overflow:hidden}
.hero .hg{display:grid;grid-template-columns:1.08fr .92fr;gap:clamp(24px,4vw,56px);align-items:center}
.hero h2{font-size:clamp(34px,5vw,64px);color:var(--navy);margin-top:14px;font-weight:700}
.hero h2 em{font-style:normal;color:var(--green-deep);font-weight:800}
.hero .lead{margin-top:20px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.art{position:relative;margin:0;max-width:600px;width:100%;justify-self:center;border-radius:28px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(20,33,46,.45)}
.art img{display:block;width:100%;height:auto}
.art figcaption{position:absolute;right:10px;bottom:10px;background:rgba(20,33,46,.72);color:#fff;font-size:11px;padding:3px 10px;border-radius:99px}
.art svg{width:100%;height:100%;display:block;border-radius:28px;box-shadow:0 30px 60px -30px rgba(7,53,71,.45)}
.chip{position:absolute;background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--navy);box-shadow:0 10px 24px -10px rgba(7,53,71,.5);display:flex;align-items:center;gap:8px;animation:bob 5s ease-in-out infinite}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--green)}
.chip.c2{animation-delay:-1.6s}.chip.c2 i{background:var(--sun)}
.chip.c3{animation-delay:-3.2s}.chip.c3 i{background:var(--navy)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.spin{transform-origin:420px 120px;animation:rot 40s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.flow{stroke-dasharray:6 10;animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:clamp(28px,4vw,52px);background:#fff;border-radius:var(--r);box-shadow:0 18px 40px -26px rgba(7,53,71,.5);border:1px solid var(--line)}
.stat{padding:22px 20px;border-right:1px solid var(--line)}.stat:last-child{border:0}
.stat b{display:block;font-family:var(--f-display);font-size:clamp(34px,4vw,50px);color:var(--navy);line-height:1}
.stat span{font-size:13.5px;color:var(--muted);display:block;margin-top:6px}


/* infographie */
.info{background:#F7C531;color:var(--ink);position:relative;overflow:hidden;padding-block:clamp(48px,7vw,92px)}
.info::before{content:"";position:absolute;right:-140px;top:-140px;width:440px;height:440px;border-radius:50%;background:rgba(255,255,255,.22)}
.info::after{content:"";position:absolute;left:-120px;bottom:-160px;width:380px;height:380px;border-radius:50%;background:rgba(180,35,24,.10)}
.info .wrap{position:relative;z-index:1}
.info .eyebrow{color:var(--red-deep)}
.info h2{font-size:clamp(30px,4.4vw,52px);color:var(--ink);margin-top:10px;max-width:20ch}
.info .sh{display:grid;gap:14px;margin-bottom:clamp(26px,4vw,46px)}
.info .lead{color:#3B3000;max-width:62ch}
.ig{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.it{background:#fff;border-radius:20px;padding:22px 20px 20px;border-top:6px solid var(--green);box-shadow:0 18px 30px -22px rgba(60,40,0,.6)}
.it.r{border-top-color:var(--red)}
.it b{display:block;font-size:clamp(36px,4.4vw,56px);font-weight:900;letter-spacing:-.035em;line-height:1;color:var(--green-deep);font-variant-numeric:tabular-nums}
.it.r b{color:var(--red)}
.it span{display:block;margin-top:10px;font-size:14px;color:var(--muted);line-height:1.4}
.pl{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pl span{background:rgba(255,255,255,.7);border-radius:99px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--ink)}
.pl b{color:var(--red);font-weight:800}
.bud{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(22px,4vw,52px);margin-top:16px;background:#fff;border-radius:24px;padding:clamp(22px,3vw,38px);box-shadow:0 18px 30px -22px rgba(60,40,0,.6)}
.bud .tot b{display:block;font-size:clamp(52px,7vw,84px);font-weight:900;color:var(--red);line-height:1;letter-spacing:-.045em;margin:10px 0 8px}
.bud .tot b small{font-size:.32em;letter-spacing:0;font-weight:800;color:var(--ink)}
.bud .tot p{margin:0 0 10px;color:var(--muted);font-size:15px}
.bud .tot .hi{color:var(--ink);font-size:16px}.bud .tot .hi strong{color:var(--green-deep);font-size:1.5em;font-weight:900}
.bars{display:grid;gap:13px;align-content:center}
.bl{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3;margin-bottom:5px}
.bt{position:relative;background:#F4EBC8;border-radius:99px;height:26px}
.bt i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--green);transform:scaleX(0);transform-origin:left;transition:transform 1.2s var(--ease) .2s}
.bt i.r{background:var(--red)}
.bud.in .bt i{transform:scaleX(1)}
.bt em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:800;font-size:13px;color:var(--ink)}
.info .note{margin:16px 0 0;font-size:13px;color:#3B3000}
@media (max-width:980px){.ig{grid-template-columns:repeat(2,1fr)}.bud{grid-template-columns:1fr}}

.pg{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:18px;align-items:stretch}
.pcol{display:grid;gap:14px;align-content:stretch}
.pcol .prog-card{padding:18px 24px;gap:6px}
.pcol .prog-card h3{font-size:20px}
.pcol .prog-card p{font-size:14px;margin:0}
.pcol .ul2{font-size:13.5px;line-height:1.4;gap:3px}
.pcol .ul2 li{margin:0}
.pv{margin:0;border-radius:var(--r);overflow:hidden;background:#14212E;min-height:480px;box-shadow:0 18px 40px -26px rgba(7,53,71,.5)}
.pv video{display:block;width:100%;height:100%;object-fit:cover}
footer .dev{padding-right:84px;margin-top:22px;padding-top:22px;border-top:1px solid rgba(255,255,255,.15);display:flex;gap:18px 28px;align-items:center;flex-wrap:wrap;justify-content:space-between}
footer .dev p{margin:0;font-size:13.5px;color:#BFDCE5;line-height:1.55;max-width:60ch}
footer .dev p b{color:#fff}
footer .by{display:flex;gap:14px;align-items:center}
footer .by img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid var(--sun);display:block}
footer .by small{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sun);font-weight:700}
footer .by strong{display:block;color:#fff;font-size:17px;font-weight:700}
.util a.cbtn{background:var(--sun);color:var(--navy-deep);font-weight:700;border-radius:99px;padding:3px 14px}

/* marquee */

/* cartes */
.grid{display:grid;gap:clamp(14px,2vw,24px)}
.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px;transition:transform .35s var(--ease),box-shadow .35s,border-color .35s;min-width:0}
.card:hover{transform:translateY(-6px);box-shadow:0 22px 40px -24px rgba(7,53,71,.55);border-color:#AFD1DC}
.card h3{font-size:22px;color:var(--navy);margin:14px 0 8px}
.card p{color:var(--muted);font-size:15.5px}
.ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--sky);color:var(--navy)}
.ico svg{width:26px;height:26px}
.ico.g{background:var(--mint);color:var(--green-deep)}.ico.y{background:var(--sun-soft);color:#8a6500}

.com{display:flex;flex-direction:column;text-decoration:none;color:inherit;position:relative;overflow:hidden}

.pgprog{--pt:#0FA8A6;--py:#FEE38A;--pg:#68AB64;--ink:#073547}

.pgprog .chero .lead,.pgprog .chero .crumb,.pgprog .chero .crumb a{color:#fff}
.pgprog .chero::after{content:"";position:absolute;right:0;bottom:0;width:min(46%,520px);height:10px;background:linear-gradient(90deg,var(--py),var(--pg))}
.pgprog .band{background:#FFF8DD}
.pgprog .pcard{border-color:rgba(7,53,71,.12);box-shadow:0 1px 0 rgba(7,53,71,.04)}
.pgprog .pcard h3{color:var(--ink);background:var(--pt)}
.pgprog .pcard:nth-child(3n+2) h3{background:var(--py)}
.pgprog .pcard:nth-child(3n) h3{background:var(--pg)}
.pgprog .pcard .go{color:#0B7F7D}
.pgprog .pcard:nth-child(3n) .go{color:#3F7D3C}
.pgprog .pcard:nth-child(3n+2) .go{color:#8A6A00}
.pgprog .btn-navy{background:var(--pt);color:var(--ink)}
.pgprog .btn-navy:hover{background:#0B8A88;color:#fff}
.pgprog .btn-line{border-color:var(--pt);color:#0B7F7D}
.pgprog .btn-line:hover{background:var(--pt);color:var(--ink)}
.pcard{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--r,14px);overflow:hidden;color:inherit;text-decoration:none;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.pcard:hover{transform:translateY(-6px);box-shadow:0 22px 40px -22px rgba(7,53,71,.55)}
.pcard h3{margin:0;padding:16px 18px;font-size:16px;line-height:1.3;min-height:96px;display:flex;align-items:center}
.pimg{aspect-ratio:4/5;overflow:hidden;background:var(--navy-deep)}
.pimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s var(--ease)}
.pcard:hover .pimg img{transform:scale(1.06)}
.pbody{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.pbody p{margin:0;font-size:13.5px;line-height:1.55;color:var(--muted);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.pbody .go{margin-top:auto;padding-top:14px;font-weight:700;font-size:14px;color:var(--navy);display:flex;gap:8px;align-items:center}
.pbody .go .ar{transition:transform .3s var(--ease)}.pcard:hover .go .ar{transform:translateX(6px)}

.com .go{margin-top:auto;padding-top:14px;font-weight:700;font-size:14px;color:var(--navy);display:flex;gap:8px;align-items:center}
.com .go .ar{transition:transform .3s var(--ease)}.com:hover .go .ar{transform:translateX(6px)}

/* pays */
.states{display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(20px,3vw,44px);align-items:center}
.states figure{margin:0;border-radius:var(--r);overflow:hidden;box-shadow:0 30px 60px -34px rgba(7,53,71,.6);background:var(--navy-deep)}
.states img{display:block;width:100%;height:auto}
.states figcaption{font-size:12.5px;color:#BFDCE5;padding:10px 16px;background:var(--navy-deep)}
.cl{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:8px}
.cl li{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;color:var(--ink)}

/* paysans */

.quote{font-family:var(--f-display);font-size:clamp(22px,3vw,34px);line-height:1.25;color:#fff;max-width:30ch;font-style:italic}

/* programmes + timeline */
.prog-card{display:flex;flex-direction:column;gap:12px}
.tag{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:4px 12px;background:var(--sun-soft);color:#7a5800;align-self:flex-start}
.tag.b{background:var(--sky);color:var(--navy)}.tag.g{background:var(--mint);color:var(--green-deep)}
.ul2{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.ul2 li{display:flex;gap:10px;color:var(--ink);font-size:15.5px}
.ul2 li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:9px}
.tl{position:relative;display:grid;gap:18px;padding-left:34px}
.tl::before{content:"";position:absolute;left:10px;top:6px;bottom:6px;width:3px;background:linear-gradient(var(--sun),var(--green),var(--sky))}
.ev{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.ev::before{content:"";position:absolute;left:-30px;top:20px;width:15px;height:15px;border-radius:50%;background:#fff;border:4px solid var(--navy)}

.ev time{font-size:12.5px;font-weight:800;color:var(--green-deep);letter-spacing:.06em;text-transform:uppercase}

/* théorie du changement */
.toc{display:grid;grid-template-columns:repeat(4,1fr);gap:0;align-items:stretch}
.tc{position:relative;padding:24px;background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-right:28px}
.tc:last-child{margin-right:0}
.tc::after{content:"";position:absolute;right:-24px;top:50%;width:20px;height:20px;border-top:4px solid var(--sun);border-right:4px solid var(--sun);transform:translateY(-50%) rotate(45deg)}
.tc:last-child::after{display:none}
.tc small{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green-deep)}
.tc h3{font-size:21px;color:var(--navy);margin:8px 0 10px}
.tc ul{margin:0;padding-left:18px;color:var(--muted);font-size:14.5px}.tc li{margin:4px 0}
.tc.fin{background:var(--navy);border-color:var(--navy)}.tc.fin h3,.tc.fin small{color:#fff}.tc.fin ul{color:#D3E8EE}.tc.fin small{color:var(--sun)}

/* actus */
.news{display:flex;flex-direction:column;gap:10px}

.soc{display:flex;flex-wrap:wrap;gap:12px}

/* pages commission */
.phero{background:#16322f;padding-block:clamp(28px,4vw,52px)}
.phero .pbgb{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:blur(46px) saturate(1.35) brightness(.9);z-index:0}
.phero .pshade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,.05));z-index:0}
.pstage{position:relative;min-height:clamp(420px,46vw,540px);display:flex;align-items:center}
.pfront{position:absolute;right:0;top:0;bottom:0;width:min(48%,520px);margin:0;border-radius:22px;overflow:hidden;box-shadow:0 30px 60px -24px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.35)}

.pglass{position:relative;z-index:2;width:min(60%,660px);padding:clamp(22px,3vw,38px);border-radius:22px;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border:1px solid rgba(255,255,255,.34);box-shadow:0 24px 50px -28px rgba(0,0,0,.55);text-shadow:0 1px 14px rgba(0,0,0,.35)}

@media(max-width:860px){.pstage{flex-direction:column;align-items:stretch;min-height:0}.pfront{position:relative;width:100%;height:clamp(240px,60vw,340px)}.pglass{width:auto;margin:-48px 12px 0}}
.chero{background:linear-gradient(120deg,var(--navy) 0%,var(--navy-deep) 100%);color:#fff;padding-block:clamp(44px,7vw,92px);position:relative;overflow:hidden}
.chero .wrap{position:relative;z-index:1}
.chero .big{position:absolute;right:max(16px,4vw);top:50%;transform:translateY(-50%);font-family:var(--f-display);font-size:clamp(180px,32vw,420px);font-weight:700;color:rgba(255,255,255,.07);line-height:.8;pointer-events:none;user-select:none}
.chero h2{font-size:clamp(32px,5.2vw,64px);margin-top:14px;max-width:18ch;color:#fff}
.chero .lead{margin-top:18px;color:#BFDCE5}
.crumb{font-size:13px;color:#BFDCE5;font-weight:600}.crumb a{text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4)}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,4vw,56px);align-items:start}
.side{background:var(--sky-soft);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:grid;gap:16px}

.pn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.pn a{display:block;text-decoration:none;border:1px solid var(--line);border-radius:var(--r);padding:18px 22px;transition:.3s var(--ease);background:#fff;min-width:0}
.pn a:hover{border-color:var(--navy);transform:translateY(-4px);box-shadow:0 18px 34px -24px rgba(7,53,71,.6)}
.pn small{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green-deep)}
.pn b{display:block;font-family:var(--f-display);font-size:19px;color:var(--navy);margin-top:4px}

/* membres, gouvernance */
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.person{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}

@media(max-width:560px){.person.pf{flex-direction:column;text-align:center}}
.oc{position:relative;flex-wrap:wrap}
.flag{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid #fff;box-shadow:0 0 0 1px var(--line),0 4px 10px -4px rgba(7,53,71,.5);display:block;transition:transform .35s var(--ease)}
.flag svg{width:100%;height:100%;display:block}
.oc:hover .flag{transform:scale(1.15) rotate(-6deg)}
.oct{flex:1 1 0;padding-right:30px}
.react{flex:0 0 100%;display:flex;gap:8px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.rb{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .2s}
.rb svg{width:17px;height:17px;fill:currentColor}
.rb:hover{border-color:var(--navy);color:var(--navy);transform:translateY(-2px)}
.rb.up.on{background:var(--green);border-color:var(--green);color:#fff}
.rb.down.on{background:var(--red);border-color:var(--red);color:#fff}

@keyframes rup{0%{transform:scale(1) rotate(0)}35%{transform:scale(1.5) rotate(-18deg) translateY(-3px)}100%{transform:scale(1) rotate(0)}}

.orgcards{align-items:start}
.oc{display:flex;gap:20px;align-items:flex-start}
.oc:hover{transform:none}

.oct{min-width:0}

.oct h3{margin:4px 0 6px}
.ocd{font-size:14.5px;line-height:1.55;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

/* chat + don */
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;width:62px;height:62px;border-radius:50%;border:0;background:var(--navy);color:#fff;box-shadow:0 14px 30px -10px rgba(7,53,71,.7);display:grid;place-items:center;transition:transform .3s var(--ease)}

   '<div class="card rv d2"><h3>'+L("Résultats intermédiaires attendus","Expected intermediate outcomes")+'</h3><p style="margin:10px 0 14px;color:#4A5B6C">'+L("À mesure que les résultats immédiats sont utilisés et consolidés, CRAFST vise à contribuer aux changements suivants.","As the immediate outputs are used and consolidated, CRAFST aims to contribute to the following changes.")+'</p>'+ul([L("Productivité agricole accrue et moyens de subsistance diversifiés.","Increased agricultural productivity and diversified livelihoods."),L("Meilleure sécurité alimentaire et nutritionnelle.","Improved food and nutrition security."),L("Risques de conflit réduits et cohésion sociale renforcée.","Reduced conflict risks and strengthened social cohesion."),L("Plus grande résilience face au changement climatique et aux catastrophes.","Greater resilience to climate change and disasters."),L("Jeunes, femmes et groupes vulnérables autonomisés.","Empowered youth, women and vulnerable groups."),L("Institutions locales et gouvernance renforcées.","Strengthened local institutions and governance.")])+'</div></div>'+
   '<p class="rv" style="margin-top:26px;max-width:70ch;font-size:17px">'+L("L'ambition va donc au-delà de l'introduction de techniques agricoles améliorées. Les communautés doivent pouvoir améliorer durablement leurs revenus et leur nutrition, mieux gérer les risques et participer plus pleinement aux décisions qui les concernent.","This means that the ambition goes beyond introducing improved farming techniques. Communities should be able to improve their incomes and nutrition sustainably, manage risks more effectively and participate more fully in decisions that affect them.")+'</p></div></section>';
  /* impact à long terme */
  s+='<section class="band band-navy"><div class="wrap pad"><div class="eyebrow rv" style="color:var(--sun)">'+L("Impact à long terme","The long-term impact")+'</div><h2 class="rv d1" style="color:#fff;max-width:24ch;margin-top:12px">'+L("Une région EAC pacifique, sûre sur le plan alimentaire, résiliente au climat et économiquement autonome.","A peaceful, food-secure, climate-resilient and economically empowered EAC region.")+'</h2>'+
   '<p class="rv d2" style="color:#BFDCE5;max-width:70ch;margin-top:18px;font-size:17px">'+L("Cette vision signifie que les communautés peuvent prendre soin de leurs terres, nourrir leurs familles, créer des opportunités et bâtir un avenir durable pour les générations à venir. La transformation recherchée concerne donc en même temps la paix, la sécurité alimentaire, la résilience environnementale et la prospérité économique.","This vision means that communities can nurture their land, feed their families, create opportunities and build a sustainable future for generations to come. The desired transformation therefore concerns peace, food security, environmental resilience and economic prosperity at the same time.")+'</p></div></section>';
  /* innovation */
  s+='<section class="band band-cream"><div class="wrap pad">'+head(L("L'innovation de CRAFST","The innovation behind CRAFST"),L("Cinq dimensions, traitées ensemble plutôt que séparément","Five dimensions, addressed together instead of separately"),L("L'approche de CRAFST consiste à réunir des dimensions souvent traitées séparément.","CRAFST's innovative approach lies in bringing together dimensions that are often addressed separately."))+
   '<div class="grid g3">'+D.map(function(d,i){return '<div class="card rv d'+(i%3+1)+'"><span class="ico '+d[1]+'">'+I[d[0]]+'</span><h3>'+d[2]+'</h3><p>'+d[3]+'</p></div>'}).join("")+'</div></div></section>';
  /* synergies */
  s+='<section class="band"><div class="wrap pad"><div class="two" style="align-items:start"><div class="rv"><div class="eyebrow">'+L("Synergies","Synergies")+'</div><h2 style="margin-top:10px">'+L("Comment les composantes se renforcent mutuellement","How the different components reinforce one another")+'</h2></div>'+
   '<div class="rv d1"><p class="lead" style="margin-top:0">'+L("La valeur ajoutée de cette théorie du changement tient aux liens entre ses composantes. Une agriculture plus résiliente peut stabiliser la production ; des chaînes de valeur mieux organisées peuvent améliorer les revenus ; l'accès aux données et à la technologie peut éclairer les décisions ; l'inclusion économique des jeunes et des femmes peut élargir les opportunités ; et la consolidation de la paix et la cohésion sociale peuvent créer un environnement plus favorable à l'activité économique et à la coopération transfrontalière.","The added value of this Theory of Change lies in the connections between its components. More resilient agriculture can stabilise production; better organised value chains can improve incomes; access to data and technology can support better decisions; the economic inclusion of young people and women can expand opportunities; and peacebuilding and social cohesion can create a more favourable environment for economic activity and cross-border cooperation.")+'</p>'+
   '<p style="margin-top:16px;font-size:17px">'+L("Ces effets sont interdépendants. Une meilleure sécurité alimentaire peut renforcer la stabilité des ménages, tandis que des moyens de subsistance plus sûrs peuvent réduire certaines formes de vulnérabilité. De même, une gestion durable des ressources naturelles soutient la production future et peut aider à réduire les tensions autour de l'accès aux ressources.","These effects are interdependent. Improved food security can strengthen household stability, while more secure livelihoods can reduce some forms of vulnerability. Similarly, sustainable natural-resource management supports future production and may help reduce tensions over access to resources.")+'</p></div></div></div></section>';

  s+='<section class="band band-mint"><div class="wrap pad">'+head("MEAL",L("Le rôle transversal du suivi, de l'évaluation, de la redevabilité et de l'apprentissage","The cross-cutting role of MEAL"),L("Le MEAL traverse tout le parcours des résultats. Il repose sur quatre fonctions : les preuves, la gestion adaptative, l'amélioration continue et l'apprentissage partagé.","MEAL cuts across the entire results pathway. It is built around four functions: evidence, adaptive management, continuous improvement and shared learning."))+

   '<div class="card rv d1">'+ul([L("<b>Suivre</b> les activités et vérifier que les résultats attendus sont bien livrés.","<b>Monitor</b> activities and verify whether the expected outputs are being delivered."),L("<b>Mesurer</b> les changements dans les pratiques agricoles, les revenus, la sécurité alimentaire, la résilience et la cohésion sociale.","<b>Measure</b> changes in agricultural practices, incomes, food security, resilience and social cohesion."),L("<b>Rendre compte</b> des progrès, des difficultés et des décisions aux communautés, aux partenaires et aux autres parties prenantes.","<b>Report</b> progress, challenges and decisions to communities, partners and other stakeholders."),L("<b>Adapter</b> les interventions à partir des données, des retours des communautés et des leçons apprises.","<b>Adapt</b> interventions based on data, community feedback and lessons learned."),L("<b>Partager</b> les connaissances entre organisations et territoires de la région EAC.","<b>Share</b> knowledge across organisations and territories in the EAC region.")])+'</div></div></section>';
  /* conclusion */
  s+='<section class="band band-navy"><div class="wrap pad"><div class="eyebrow rv" style="color:var(--sun)">Conclusion</div><h2 class="rv d1" style="color:#fff;max-width:24ch;margin-top:12px">'+L("Le changement que CRAFST veut rendre possible","The change CRAFST seeks to make possible")+'</h2>'+

   '<p class="rv d2" style="color:#BFDCE5;max-width:72ch;margin-top:14px;font-size:17px">'+L("Le succès de cette théorie du changement dépendra de la qualité des partenariats, de l'appropriation locale, d'un accès effectif aux marchés et au financement, de la prise en compte des risques liés aux conflits et au climat, et de la capacité à apprendre et à adapter les interventions dans la durée.","The success of this Theory of Change will depend on the quality of partnerships, local ownership, effective access to markets and finance, the integration of conflict and climate-risk considerations, and the ability to learn and adapt interventions over time.")+'</p>'+
   '<div class="cta rv d3" style="margin-top:28px"><a class="btn btn-sun" href="#accueil" data-go="accueil">'+L("Retour à l'accueil","Back to home")+' <span class="ar">→</span></a></div></div></section>';
  return s;
}

ral, vocational training and survivor-support activities with community and church partners."]].sort(function(a,b){return (b[2]?1:0)-(a[2]?1:0)}).map(function(p,i){return p[2]?'<div class="person pf rv"><img src="'+LG(p[2])+'" alt="'+p[1]+'" loading="lazy"><div><small>'+p[0]+'</small><b>'+p[1]+'</b><p>'+p[3]+'</p></div></div>':'<div class="person rv d'+(i%3+1)+'"><small>'+p[0]+'</small><b>'+p[1]+'</b></div>'}).join("")+'</div></div></section>';

/* ---------- rendu ---------- */
var io=null;
function reveal(){
  var els=$$(".rv:not(.in)");
  if(io)io.disconnect();
  if(!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in")});return}
  io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);$$("[data-count]",e.target).forEach(count)}})},{threshold:.12,rootMargin:"0px 0px -4% 0px"});
  els.forEach(function(e){io.observe(e)});
  setTimeout(function(){$$(".rv:not(.in)").forEach(function(e){e.classList.add("in")})},1800);
}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"\u202f")}
function count(el){
  var t=+el.getAttribute("data-count"),i=0,st=Math.max(1,Math.ceil(t/28));
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=fmt(t);return}
  el.textContent="0";var iv=setInterval(function(){i+=st;if(i>=t){i=t;clearInterval(iv)}el.textContent=fmt(i)},45);
}
function render(){
  var v=route();var changed=v!==cur;cur=v;
  document.body.classList.toggle("nohome",v!=="accueil");
  var main=$("#main");
  var h=v==="accueil"?vAccueil():v==="a-propos"?vApropos():v==="bailleurs"?vBailleurs():v==="actualites"?vActus():v==="careers"?vCareers():v==="contact"?vContact():v==="commissions"?vProgrammes():v==="publications"?vPublications():v==="medias"?vMedias():v==="partenariat"?vPartenariat():v==="theory-of-change"?vTheory():vCom(+v.split("-")[1]);
  main.innerHTML=h;if(window.paintOrgReact)paintOrgReact();
  main.classList.remove("enter");void main.offsetWidth;if(changed)main.classList.add("enter");
  renderChrome();crLogo();
  var pr=$("#prog");pr.classList.remove("run");void pr.offsetWidth;if(changed)pr.classList.add("run");
  document.documentElement.lang=lang;
  document.title="CRAFST – Amani na Chakula";
  reveal();
  var cf=$("#cform");if(cf)cf.addEventListener("submit",function(e){e.preventDefault();$("#cmsg").innerHTML='<div class="note">'+L("Message non envoyé : la messagerie du réseau n'est pas encore connectée. Le courriel officiel sera publié sur cette page.","Message not sent: the network's mailbox is not connected yet. The official email will be published on this page.")+'</div>'});
  if(pendingSec){var id=pendingSec;pendingSec=null;setTimeout(function(){var t=document.getElementById(id);if(t){var y=t.getBoundingClientRect().top+window.scrollY-60;window.scrollTo({top:y,behavior:"smooth"})}},120)}
  else if(changed)window.scrollTo(0,0);
  var act=$("#chatbox .chat");if(act)chat(true);
}

   '<div class="body"><div class="bub">'+L("Bonjour ! Je serai l'assistant du réseau CRAFST : je répondrai aux questions des organisations, des bailleurs et des paysans.","Hello! I will be the CRAFST network assistant, answering questions from organisations, donors and farmers.")+'</div><div class="bub s">'+L("Le chat n'est pas encore installé. En attendant, ces pages répondent aux questions les plus fréquentes.","The chat is not installed yet. Meanwhile, these pages answer the most common questions.")+'</div>'+
   '<div class="qk"><button data-go="a-propos">'+L("Qui sommes-nous ?","Who are we?")+'</button><button data-go="bailleurs">'+L("Je suis bailleur","I am a donor")+'</button><button data-go="commission-1">'+L("Les programmes","Programs")+'</button><button data-go="contact">'+L("Rejoindre","Join")+'</button></div></div>'+
   '<form onsubmit="return false"><input type="text" disabled placeholder="'+L("Le chat sera bientôt actif","Chat will be active soon")+'" aria-label="'+L("Message","Message")+'"><button disabled aria-label="'+L("Envoyer","Send")+'">➤</button></form></div>';

var donState={amt:50,freq:0,step:1};

  donState.step=1;drawDon();
}
function drawDon(){
  var m=$("#modal");
  var body;
  if(donState.step===1){
    body='<h3>'+L("Soutenir CRAFST","Support CRAFST")+'</h3><p style="margin-top:10px;color:#4A5B6C">'+L("Votre don soutient les activités du réseau : plans d'action des programmes, collecte de données, visites de terrain auprès des paysans.","Your gift supports network activities: program action plans, data collection, field visits with farmers.")+'</p>'+
     '<div class="seg" role="group" aria-label="'+L("Fréquence","Frequency")+'"><button data-freq="0" aria-pressed="'+(donState.freq===0)+'">'+L("Une fois","Once")+'</button><button data-freq="1" aria-pressed="'+(donState.freq===1)+'">'+L("Chaque mois","Monthly")+'</button></div>'+
     '<div class="amts">'+[25,50,100,250].map(function(a){return '<button data-amt="'+a+'" aria-pressed="'+(donState.amt===a)+'">$'+a+'</button>'}).join("")+'</div>'+
     '<button class="btn btn-sun" data-step="2" style="width:100%;justify-content:center">'+L("Continuer avec","Continue with")+' $'+donState.amt+(donState.freq?L(" par mois"," a month"):"")+' <span class="ar">→</span></button>';
  }else{
    body='<h3>'+L("Le don en ligne ouvre bientôt","Online giving opens soon")+'</h3><div class="note" style="margin-top:14px">'+L("Aucun paiement n'est possible sur ce site pour le moment et aucune donnée bancaire n'est demandée. Votre choix n'a pas été enregistré.","No payment can be made on this site yet and no card details are requested. Your choice has not been saved.")+'</div><p style="margin-top:14px;color:#4A5B6C">'+L("Pour soutenir le réseau dès maintenant, écrivez au secrétariat : nous vous répondrons avec les modalités de don.","To support the network right away, write to the secretariat: we will reply with the ways to give.")+'</p><div class="cta"><a class="btn btn-navy" href="#contact" data-go="contact" data-close="modal">'+L("Écrire au secrétariat","Write to the secretariat")+' <span class="ar">→</span></a><button class="btn btn-line" data-step="1">'+L("Retour","Back")+'</button></div>';
  }
  m.innerHTML='<div class="ov" data-close="modal"><div class="dlg" role="dialog" aria-modal="true" aria-label="'+L("Faire un don","Donate")+'"><button class="x" data-close="modal" aria-label="'+L("Fermer","Close")+'">×</button>'+body+'</div></div>';
  var f=$(".dlg button.btn,.dlg a.btn",m);if(f)f.focus({preventScroll:true});

  var t=e.target;
