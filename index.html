<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>CRAFST – Amani na Chakula</title>
<meta name="description" content="CRAFST – Amani na Chakula: a regional network for cross-border cooperation on food security and peace in East Africa.">
<link rel="preload" as="image" href="media/rice.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* Concept : plateforme régionale lumineuse. Fond blanc, bleu dominant, jaune maïs en accent, vert dosé.
   Bandes alternées séparées par des vagues, hero à champs en terrasses, schéma de corridor transfrontalier. */
:root{
  --navy:#17467F; --navy-deep:#0E2E57; --green:#2E8B3E; --green-deep:#1F6B33;
  --sun:#F2B705; --sun-soft:#FDF1C4; --sky:#DCE9F5; --sky-soft:#EEF5FB; --mint:#E6F2E3;
  --ink:#14212E; --muted:#4A5B6C; --line:#D5E1EC; --bg:#FFFFFF;
  --f-display:"Inter","Segoe UI",system-ui,sans-serif;
  --f-ui:"Inter","Segoe UI",system-ui,sans-serif;
  --red:#B42318; --red-deep:#8E1B13; --cream:#FDF1C4;
  --r:18px; --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy-deep)}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.025em}
p{margin:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--green-deep)}
.on-dark .eyebrow{color:var(--sun)}
.lead{font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:62ch}
.on-dark .lead{color:#C9DAEC}

/* barre utilitaire */
.util{background:var(--navy-deep);color:#DCE9F5;font-size:13px}
.util .wrap{display:flex;gap:6px 18px;align-items:center;justify-content:space-between;padding-block:8px;flex-wrap:wrap}
.util nav{display:flex;gap:4px 16px;flex-wrap:wrap;align-items:center}
.util a,.util button.ul{color:#DCE9F5;text-decoration:none;background:none;border:0;padding:2px 0;font-size:13px;font-weight:500}
.util a:hover,.util button.ul:hover{color:var(--sun)}
.lang{display:inline-flex;border:1px solid #3a5f92;border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:#DCE9F5;padding:2px 11px;font-size:12px;font-weight:700}
.lang button[aria-pressed=true]{background:var(--sun);color:var(--navy-deep)}

/* en-tête : diaporama */
.top{position:relative;height:clamp(400px,50vw,580px);background:var(--navy-deep);overflow:hidden;isolation:isolate}
.sl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease;transform:scale(1.02)}
.sl.on{opacity:1;animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.09)}}
.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,46,87,.18) 0%,rgba(14,46,87,0) 35%,rgba(14,46,87,.62) 100%);z-index:1}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:2;background:rgba(14,46,87,.22);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);border-top:1px solid rgba(255,255,255,.28);color:#fff}
.cap .wrap{display:flex;align-items:center;gap:clamp(14px,2.4vw,30px);padding-block:clamp(14px,2.2vw,26px)}
.cap img{width:clamp(62px,8vw,104px);height:auto;flex:none;border-radius:16px;background:#fff;padding:5px;box-shadow:0 8px 24px -8px rgba(0,0,0,.5)}
.cap h1{font-size:clamp(50px,9.5vw,118px);font-weight:900;letter-spacing:-.045em;line-height:.88;color:#fff;text-shadow:0 3px 24px rgba(0,0,0,.4)}
.cap .sw{font-weight:800;color:var(--sun);font-size:clamp(14px,1.5vw,19px);letter-spacing:.04em;margin-top:8px;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.cap .defn{margin-top:10px;font-size:clamp(10.5px,1.2vw,14px);font-weight:700;letter-spacing:.12em;text-transform:uppercase;line-height:1.45;max-width:64ch;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.dots{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:16px;z-index:3;display:flex;gap:8px}
.dots button{width:30px;height:5px;border-radius:5px;border:0;padding:0;background:rgba(255,255,255,.5);transition:.3s}
.dots button[aria-current=true]{background:var(--sun);width:46px}
.mainnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--navy);box-shadow:0 6px 18px -10px rgba(14,46,87,.6)}
.mainnav .wrap{display:flex;align-items:stretch}
.mainnav ul{display:flex;list-style:none;margin:0;padding:0;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.mainnav ul::-webkit-scrollbar{display:none}
.mainnav li{flex:none}
.mainnav a.nv{display:block;color:#fff;text-decoration:none;font-weight:600;font-size:14.5px;padding:15px 11px;position:relative;white-space:nowrap}
.mainnav a.nv::after{content:"";position:absolute;left:11px;right:11px;bottom:8px;height:3px;border-radius:3px;background:var(--sun);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.mainnav a.nv:hover::after,.mainnav a.nv[aria-current=page]::after{transform:scaleX(1)}
.mainnav a.nv .n{color:var(--sun);font-weight:800;margin-right:5px;font-size:12px}
.mainnav .dn{align-self:center;margin-left:8px;flex:none}
.prog{position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,var(--sun),var(--green),var(--sun));transform:scaleX(0);transform-origin:left;opacity:0}
.prog.run{animation:sweep .8s var(--ease)}
@keyframes sweep{0%{transform:scaleX(0);opacity:1}70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}

/* boutons */
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:99px;padding:13px 24px;font-weight:700;font-size:15px;text-decoration:none;border:2px solid transparent;transition:transform .25s var(--ease),box-shadow .25s,background .25s,color .25s;position:relative;overflow:hidden;line-height:1.2}
.btn .ar{display:inline-block;transition:transform .3s var(--ease)}
.btn:hover .ar{transform:translateX(5px)}
.btn:active{transform:scale(.97)}
.btn-sun{background:var(--sun);color:var(--navy-deep)}
.btn-sun:hover{box-shadow:0 10px 24px -8px rgba(242,183,5,.8);transform:translateY(-2px)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-deep);box-shadow:0 10px 24px -10px rgba(23,70,127,.8);transform:translateY(-2px)}
.btn-line{border-color:var(--navy);color:var(--navy);background:transparent}
.btn-line:hover{background:var(--navy);color:#fff;transform:translateY(-2px)}
.on-dark .btn-line{border-color:#fff;color:#fff}.on-dark .btn-line:hover{background:#fff;color:var(--navy)}
.btn-sm{padding:8px 16px;font-size:13.5px}
.btn[disabled],.btn.off{opacity:.55;cursor:not-allowed}
.btn .heart{display:inline-block;animation:beat 2.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.25)}24%{transform:scale(1)}}

/* vues */
main{display:block;min-height:60vh}
main.enter>*{animation:rise .6s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}.rv.d4{transition-delay:.32s}

.band{padding-block:clamp(56px,8vw,104px);position:relative}
.band-sky{background:var(--sky-soft)}
.band-navy{background:var(--navy);color:#fff}
.band-deep{background:var(--navy-deep);color:#fff}
.band-mint{background:var(--mint)}
.on-dark h2,.on-dark h3{color:#fff}
.band h2{font-size:clamp(30px,4.4vw,52px);color:var(--navy);margin-top:10px}
.band .sh{display:grid;gap:14px;margin-bottom:clamp(30px,4vw,52px)}
.wave{display:block;width:100%;height:clamp(34px,5vw,70px);margin-bottom:-1px}

/* hero */
.hero{background:linear-gradient(180deg,#fff 0%,var(--sky-soft) 100%);padding-block:clamp(36px,6vw,80px) clamp(20px,4vw,50px);position:relative;overflow:hidden}
.hero .hg{display:grid;grid-template-columns:1.08fr .92fr;gap:clamp(24px,4vw,56px);align-items:center}
.hero h2{font-size:clamp(34px,5vw,64px);color:var(--navy);margin-top:14px;font-weight:700}
.hero h2 em{font-style:normal;color:var(--green-deep);font-weight:800}
.hero .lead{margin-top:20px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.art{position:relative;margin:0;max-width:600px;width:100%;justify-self:center;border-radius:28px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(20,33,46,.45)}
.art img{display:block;width:100%;height:auto}
.art figcaption{position:absolute;right:10px;bottom:10px;background:rgba(20,33,46,.72);color:#fff;font-size:11px;padding:3px 10px;border-radius:99px}
.art svg{width:100%;height:100%;display:block;border-radius:28px;box-shadow:0 30px 60px -30px rgba(14,46,87,.45)}
.chip{position:absolute;background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--navy);box-shadow:0 10px 24px -10px rgba(14,46,87,.5);display:flex;align-items:center;gap:8px;animation:bob 5s ease-in-out infinite}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--green)}
.chip.c2{animation-delay:-1.6s}.chip.c2 i{background:var(--sun)}
.chip.c3{animation-delay:-3.2s}.chip.c3 i{background:var(--navy)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.spin{transform-origin:420px 120px;animation:rot 40s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.flow{stroke-dasharray:6 10;animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:clamp(28px,4vw,52px);background:#fff;border-radius:var(--r);box-shadow:0 18px 40px -26px rgba(14,46,87,.5);border:1px solid var(--line)}
.stat{padding:22px 20px;border-right:1px solid var(--line)}.stat:last-child{border:0}
.stat b{display:block;font-family:var(--f-display);font-size:clamp(34px,4vw,50px);color:var(--navy);line-height:1}
.stat span{font-size:13.5px;color:var(--muted);display:block;margin-top:6px}


/* infographie */
.info{background:#F7C531;color:var(--ink);position:relative;overflow:hidden;padding-block:clamp(48px,7vw,92px)}
.info::before{content:"";position:absolute;right:-140px;top:-140px;width:440px;height:440px;border-radius:50%;background:rgba(255,255,255,.22)}
.info::after{content:"";position:absolute;left:-120px;bottom:-160px;width:380px;height:380px;border-radius:50%;background:rgba(180,35,24,.10)}
.info .wrap{position:relative;z-index:1}
.info .eyebrow{color:var(--red-deep)}
.info h2{font-size:clamp(30px,4.4vw,52px);color:var(--ink);margin-top:10px;max-width:20ch}
.info .sh{display:grid;gap:14px;margin-bottom:clamp(26px,4vw,46px)}
.info .lead{color:#3B3000;max-width:62ch}
.ig{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.it{background:#fff;border-radius:20px;padding:22px 20px 20px;border-top:6px solid var(--green);box-shadow:0 18px 30px -22px rgba(60,40,0,.6)}
.it.r{border-top-color:var(--red)}
.it b{display:block;font-size:clamp(36px,4.4vw,56px);font-weight:900;letter-spacing:-.035em;line-height:1;color:var(--green-deep);font-variant-numeric:tabular-nums}
.it.r b{color:var(--red)}
.it span{display:block;margin-top:10px;font-size:14px;color:var(--muted);line-height:1.4}
.pl{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pl span{background:rgba(255,255,255,.7);border-radius:99px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--ink)}
.pl b{color:var(--red);font-weight:800}
.bud{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(22px,4vw,52px);margin-top:16px;background:#fff;border-radius:24px;padding:clamp(22px,3vw,38px);box-shadow:0 18px 30px -22px rgba(60,40,0,.6)}
.bud .tot b{display:block;font-size:clamp(52px,7vw,84px);font-weight:900;color:var(--red);line-height:1;letter-spacing:-.045em;margin:10px 0 8px}
.bud .tot b small{font-size:.32em;letter-spacing:0;font-weight:800;color:var(--ink)}
.bud .tot p{margin:0 0 10px;color:var(--muted);font-size:15px}
.bud .tot .hi{color:var(--ink);font-size:16px}.bud .tot .hi strong{color:var(--green-deep);font-size:1.5em;font-weight:900}
.bars{display:grid;gap:13px;align-content:center}
.bl{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3;margin-bottom:5px}
.bt{position:relative;background:#F4EBC8;border-radius:99px;height:26px}
.bt i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--green);transform:scaleX(0);transform-origin:left;transition:transform 1.2s var(--ease) .2s}
.bt i.r{background:var(--red)}
.bud.in .bt i{transform:scaleX(1)}
.bt em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:800;font-size:13px;color:var(--ink)}
.info .note{margin:16px 0 0;font-size:13px;color:#3B3000}
@media (max-width:980px){.ig{grid-template-columns:repeat(2,1fr)}.bud{grid-template-columns:1fr}}

.pg{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:18px;align-items:stretch}
.pcol{display:grid;gap:14px;align-content:stretch}
.pcol .prog-card{padding:18px 24px;gap:6px}
.pcol .prog-card h3{font-size:20px}
.pcol .prog-card p{font-size:14px;margin:0}
.pcol .ul2{font-size:13.5px;line-height:1.4;gap:3px}
.pcol .ul2 li{margin:0}
.pv{margin:0;border-radius:var(--r);overflow:hidden;background:#14212E;min-height:480px;box-shadow:0 18px 40px -26px rgba(14,46,87,.5)}
.pv video{display:block;width:100%;height:100%;object-fit:cover}
footer .dev{padding-right:84px;margin-top:22px;padding-top:22px;border-top:1px solid rgba(255,255,255,.15);display:flex;gap:18px 28px;align-items:center;flex-wrap:wrap;justify-content:space-between}
footer .dev p{margin:0;font-size:13.5px;color:#C9DAEC;line-height:1.55;max-width:60ch}
footer .dev p b{color:#fff}
footer .by{display:flex;gap:14px;align-items:center}
footer .by img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid var(--sun);display:block}
footer .by small{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sun);font-weight:700}
footer .by strong{display:block;color:#fff;font-size:17px;font-weight:700}
.util a.cbtn{background:var(--sun);color:var(--navy-deep);font-weight:700;border-radius:99px;padding:3px 14px}
.util a.cbtn:hover{background:#fff;color:var(--navy-deep)}
.fnd{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:clamp(22px,4vw,56px);align-items:center;margin-bottom:clamp(34px,5vw,60px)}
.fnd figure{margin:0;border-radius:var(--r);overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 24px 50px -30px rgba(14,46,87,.55)}
.fnd img{display:block;width:100%;height:auto}
.fnd figcaption{font-size:12.5px;color:var(--muted);padding:10px 14px}
.fnd h3{font-size:clamp(24px,3vw,34px);color:var(--navy);margin:10px 0 12px;line-height:1.15}
.fnd p{font-size:16.5px;color:var(--muted);max-width:56ch;margin:0 0 20px}
@media (max-width:980px){.fnd{grid-template-columns:1fr}.fnd figure{max-width:380px;justify-self:center}}
.mem{background:#fff;padding-block:clamp(40px,6vw,72px) clamp(36px,5vw,60px)}
.mg+.mg{margin-top:clamp(30px,4vw,48px)}
.mh{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--green-deep);margin:0 0 16px}
.mrow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
@media (min-width:900px){.mg:first-child .mrow{grid-template-columns:repeat(4,1fr)}}
.mi{border:1px solid var(--line);border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px 14px;min-height:132px}
.mi img{display:block;height:84px;width:auto;max-width:170px;object-fit:contain}
.mi b{font-size:24px;font-weight:800;letter-spacing:-.01em;color:var(--navy);text-align:center;line-height:1.1}
.mi small{font-size:12px;font-weight:500;color:var(--muted);text-align:center;line-height:1.35}
/* marquee */
.marq{background:var(--green-deep);color:#fff;overflow:hidden;padding-block:14px;white-space:nowrap}
.marq div{display:inline-block;animation:mq 75s linear infinite;font-family:var(--f-display);font-weight:600;font-size:clamp(20px,2.6vw,30px)}
.marq span{margin:0 clamp(26px,3.4vw,48px)}
@keyframes mq{to{transform:translateX(-50%)}}

/* cartes */
.grid{display:grid;gap:clamp(14px,2vw,24px)}
.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px;transition:transform .35s var(--ease),box-shadow .35s,border-color .35s;min-width:0}
.card:hover{transform:translateY(-6px);box-shadow:0 22px 40px -24px rgba(14,46,87,.55);border-color:#b9cfe4}
.card h3{font-size:22px;color:var(--navy);margin:14px 0 8px}
.card p{color:var(--muted);font-size:15.5px}
.ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--sky);color:var(--navy)}
.ico svg{width:26px;height:26px}
.ico.g{background:var(--mint);color:var(--green-deep)}.ico.y{background:var(--sun-soft);color:#8a6500}
.on-dark .card{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18)}
.on-dark .card h3{color:#fff}.on-dark .card p{color:#C9DAEC}

.com{display:flex;flex-direction:column;text-decoration:none;color:inherit;position:relative;overflow:hidden}
.com .no{font-family:var(--f-display);font-size:54px;line-height:1;color:var(--sky);font-weight:700;transition:color .3s}
.com:hover .no{color:var(--sun)}
.com h3{font-size:20px;margin:16px 0 6px}
.com .go{margin-top:auto;padding-top:14px;font-weight:700;font-size:14px;color:var(--navy);display:flex;gap:8px;align-items:center}
.com .go .ar{transition:transform .3s var(--ease)}.com:hover .go .ar{transform:translateX(6px)}

/* pays */
.states{display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(20px,3vw,44px);align-items:center}
.states figure{margin:0;border-radius:var(--r);overflow:hidden;box-shadow:0 30px 60px -34px rgba(14,46,87,.6);background:var(--navy-deep)}
.states img{display:block;width:100%;height:auto}
.states figcaption{font-size:12.5px;color:#C9DAEC;padding:10px 16px;background:var(--navy-deep)}
.cl{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:8px}
.cl li{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;color:var(--ink)}
.cl .st{margin-left:auto;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:3px 10px;white-space:nowrap}
.st.a{background:var(--mint);color:var(--green-deep)}.st.e{background:var(--sun-soft);color:#7a5800}.st.o{background:var(--sky);color:var(--navy)}
.cl .dot{width:10px;height:10px;border-radius:50%;background:var(--navy);flex:none}

/* paysans */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:s;position:relative}
.step{padding:6px 22px 6px 0;position:relative}

var io=null;
function reveal(){
  var els=$$(".rv:not(.in)");
  if(io)io.disconnect();
  if(!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in")});return}
  io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);$$("[data-count]",e.target).forEach(count)}})},{threshold:.12,rootMargin:"0px 0px -4% 0px"});
  els.forEach(function(e){io.observe(e)});
  setTimeout(function(){$$(".rv:not(.in)").forEach(function(e){e.classList.add("in")})},1800);
}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"\u202f")}
function count(el){
  var t=+el.getAttribute("data-count"),i=0,st=Math.max(1,Math.ceil(t/28));
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=fmt(t);return}
  el.textContent="0";var iv=setInterval(function(){i+=st;if(i>=t){i=t;clearInterval(iv)}el.textContent=fmt(i)},45);
}

    body='<h3>'+L("Le don en ligne ouvre bientôt","Online giving opens soon")+'</h3><div class="note" style="margin-top:14px">'+L("Aucun paiement n'est possible sur ce site pour le moment et aucune donnée bancaire n'est demandée. Votre choix n'a pas été enregistré.","No payment can be made on this site yet and no card details are requested. Your choice has not been saved.")+'</div><p style="margin-top:14px;color:#4A5B6C">'+L("Pour soutenir le réseau dès maintenant, écrivez au secrétariat : nous vous répondrons avec les modalités de don.","To support the network right away, write to the secretariat: we will reply with the ways to give.")+'</p><div class="cta"><a class="btn btn-navy" href="#contact" data-go="contact" data-close="modal">'+L("Écrire au secrétariat","Write to the secretariat")+' <span class="ar">→</span></a><button class="btn btn-line" data-step="1">'+L("Retour","Back")+'</button></div>';
  }
  m.innerHTML='<div class="ov" data-close="modal"><div class="dlg" role="dialog" aria-modal="true" aria-label="'+L("Faire un don","Donate")+'"><button class="x" data-close="modal" aria-label="'+L("Fermer","Close")+'">×</button>'+body+'</div></div>';
  var f=$(".dlg button.btn,.dlg a.btn",m);if(f)f.focus({preventScroll:true});
}
function closeModal(){$("#modal").innerHTML=""}

/* ---------- événements ---------- */
document.addEventListener("click",function(e){
  var t=e.target;
  var c=t.closest("[data-close]");
  if(c&&c.classList.contains("ov")&&t!==c)c=null;
  if(c){
    var w=c.getAttribute("data-close");
    if(w==="modal"){closeModal();if(!c.hasAttribute("data-go")){e.preventDefault();return}}
    if(w==="chat"){chat();return}
  }
  var o=t.closest("[data-open]");if(o){e.preventDefault();if(o.getAttribute("data-open")==="don")donate();return}
  var l=t.closest("[data-lang]");if(l){lang=l.getAttribute("data-lang");try{localStorage.setItem("crafst-lang",lang)}catch(x){}render();if($("#modal").innerHTML)drawDon();return}
  var a=t.closest("[data-amt]");if(a){donState.amt=+a.getAttribute("data-amt");drawDon();return}
  var fq=t.closest("[data-freq]");if(fq){donState.freq=+fq.getAttribute("data-freq");drawDon();return}
  var st=t.closest("[data-step]");if(st){donState.step=+st.getAttribute("data-step");drawDon();return}
  var g=t.closest("[data-go]");
  if(g){e.preventDefault();var sec=g.getAttribute("data-sec");go(g.getAttribute("data-go"),sec);if(chatOpen&&g.closest(".chat")){chatOpen=false;chat(true)}return}
  var s=t.closest("[data-sec]");
  if(s){e.preventDefault();var id=s.getAttribute("data-sec");if(cur!=="accueil"){go("accueil",id)}else{var el=document.getElementById(id);if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-60,behavior:"smooth"})}}
});
$("#fab").addEventListener("click",function(){chat()});
document.addEventListener("submit",function(e){
  if(e.target.id!=="nlform")return;e.preventDefault();
  var em=$("#nl-e").value.trim(),ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em),ck=$("#nl-c").checked,m=$("#nlmsg");
  if(!ok){m.innerHTML='<div class="msg">'+L("Saisissez une adresse courriel valide.","Enter a valid email address.")+'</div>';return}
  if(!ck){m.innerHTML='<div class="msg">'+L("Cochez la case de consentement pour continuer.","Tick the consent box to continue.")+'</div>';return}
  m.innerHTML='<div class="msg">'+L("L'abonnement ouvrira bientôt. Votre adresse n'a pas été enregistrée.","Subscriptions open soon. Your address has not been saved.")+'</div>';
});
/* diaporama d'en-tête */
(function(){
  var s=[$("#sl0"),$("#sl1")],i=0,dots=$("#dots"),timer=null;
  s[0].style.backgroundImage="url('media/rice.jpg')";
  s[0].style.backgroundPosition="center 30%";
  s[1].style.backgroundImage="url('"+HERO+"')";
  s[1].style.backgroundPosition="center 40%";
  s.forEach(function(_,k){var b=document.createElement("button");b.setAttribute("aria-label","Photo "+(k+1));b.addEventListener("click",function(){show(k);restart()});dots.appendChild(b)});
  function show(k){i=k;s.forEach(function(el,j){el.classList.remove("on");if(j===k){void el.offsetWidth;el.classList.add("on")}});$$("button",dots).forEach(function(b,j){b.setAttribute("aria-current",j===k)})}
  function restart(){clearInterval(timer);if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;timer=setInterval(function(){show((i+1)%s.length)},6500)}
  show(0);restart();
})();
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if($("#modal").innerHTML)closeModal();else if(chatOpen)chat()}});

render();
})();
</script>
